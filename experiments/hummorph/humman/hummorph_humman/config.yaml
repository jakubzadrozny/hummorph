task: 'humman'
experiment: 'hummorph_humman'

n_gpus: 1
num_workers: 2

train:
  dataset: 'humman_train'
  maxiter: 300000
  lr: 0.0002
  lr_mweight_vol_decoder: 0.00002
  lrate_decay: 200
  save_checkpt_interval: 5000
  save_model_interval: 10000
  lossweights:
    lpips: 1.0
    mse: 0.3
    consis: 0.5
    dist: 0.1
    smoothness: 0.005

progress:
  dataset: 'humman_test'
  observed_frames:
    - 0
    - 5

eval:
  dataset: 'humman_test'
  split: test
  cutoff: 0.5
  observed_frames:
    - 0
    - 0.25
  
resize_img_scale: 0.33
resize_img_scale_obs: 0.25

patch:
  sample_subject_ratio: 0.9
  N_patches: 5
  size: 32      # [Patch] size of patch

chunk: 4096 # reduce if OOM
